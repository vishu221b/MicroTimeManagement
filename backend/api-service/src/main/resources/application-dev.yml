server:
  servlet:
    context-path: /mtm-dev
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtm_dev}
    username: ${SPRING_DATASOURCE_USERNAME:mtm}
    password: ${SPRING_DATASOURCE_PASSWORD:mtm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
springdoc:
  swagger-ui:
    default-model-expand-depth: 5
    default-models-expand-depth: -1
    use-root-path: true
  show-actuator: false
management:
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  file:
    name: log/mtm_test.log
jwt:
  secret: ${MTM_JWT_SECRET:jnv89h4qp98hon98q34opf0934ur0f2iqk40if0935ut09843u908fu4309gh03589rjf0934j0fj304jf930j094f0934o}
