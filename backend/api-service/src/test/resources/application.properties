# Hermetic test config — in-memory H2 in PostgreSQL-compatibility mode.
# Overrides src/main/resources/application.properties on the test classpath so
# the suite (incl. @SpringBootTest contextLoads) needs no external database.
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:mtm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
jwt.secret=test-secret-0123456789-0123456789-0123456789-0123456789-0123456789
