# Full-stack Micro Time Management deployment.
#
#   docker compose up --build            → mongo + backend + frontend
#   docker compose --profile tools up    → also starts mongo-express (DB UI)
#
# Frontend:  http://localhost:3000
# Backend:   http://localhost:8080/mtm-dev  (Swagger at /swagger-ui.html)
# Mongo:     localhost:27017

services:
  mtm_mongo:
    container_name: mtm_mongo
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mtm_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mtm_backend:
    container_name: mtm_backend
    build:
      context: ./backend/api-service
      dockerfile: Dockerfile
    image: mtm/api-service:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: mongodb://mtm_mongo:27017/mtm_dev
      MTM_JWT_SECRET: ${MTM_JWT_SECRET:-jnv89h4qp98hon98q34opf0934ur0f2iqk40if0935ut09843u908fu4309gh03589rjf0934j0fj304jf930j094f0934o}
      MTM_CORS_ORIGINS: ${MTM_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      JAVA_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      mtm_mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/mtm-dev/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  mtm_frontend:
    container_name: mtm_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${MTM_API_BASE_URL:-http://localhost:8080/mtm-dev/api/v1}
    image: mtm/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - mtm_backend

  mtm_mongo_express:
    container_name: mtm_mongo_express
    image: mongo-express
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mtm_mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mtm_mongo:
        condition: service_healthy

volumes:
  mtm_mongo_data:
